# Mantiene con actividad el tier gratuito de Render.
#
# Render duerme el Web Service tras 15 minutos sin tráfico. Tres ejecuciones
# semanales dejan un hueco máximo de 2-3 días, suficiente para absorber los retrasos
# de los crons de GitHub (el run del 2026-11-19 llegó casi 10 h tarde).
#
# Neon no necesita keep-alive: el compute se suspende por inactividad y se reanuda
# solo con la siguiente consulta. Basta con /healthz, que ejecuta un SELECT 1 y deja
# actividad real en la base de datos.
#
# No se hacen deploys a propósito: Render no suspende por falta de despliegues,
# solo por agotar las 750 h de instancia o el ancho de banda del plan Free.
#
# Ver DEPLOY.md, sección 13.

name: Keep-alive

on:
  schedule:
    # Lunes, miércoles y viernes a las 06:17 UTC. Evito el minuto :00 porque
    # GitHub retrasa las ejecuciones en las horas en punto.
    - cron: "17 6 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  render:
    name: Prueba de vida de Render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: GET / y /healthz
        run: |
          # El primer request puede tardar ~1 minuto si el servicio está dormido.
          curl -fsS --retry 3 --retry-connrefused --retry-delay 15 \
            --max-time 120 -o /dev/null https://syntaxsprint.onrender.com/

          # /healthz ejecuta SELECT 1: despierta Render y deja actividad real en
          # la base de datos de Neon.
          curl -fsS --retry 3 --retry-connrefused --retry-delay 15 \
            --max-time 120 https://syntaxsprint.onrender.com/healthz
