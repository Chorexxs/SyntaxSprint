name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, check y pruebas
    # ubuntu-24.04: la versión la fija .python-version (minor 3.12) para
    # Render, CI y Vercel.
    runs-on: ubuntu-24.04
    env:
      # Valores exclusivos de CI. No son secretos de producción.
      SECRET_KEY: ci-only-placeholder-key-not-used-in-production-0000000000
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      # Vacío => la suite usa SQLite en memoria, sin servicio PostgreSQL.
      DATABASE_URL: ""
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Configurar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Instalar Tailwind
        run: npm ci

      - name: Comprobar el CSS compilado
        run: |
          npm run build:css
          git diff --exit-code -- syntax_sprint/static/css/tailwind.css

      - name: Probar el JavaScript
        run: npm run test:js

      - name: Comprobar dependencias
        run: python specs/tools/check_dependencies.py --strict

      - name: Comprobar imports (isort)
        working-directory: syntax_sprint
        run: isort --check-only --diff .

      - name: Comprobar el proyecto
        working-directory: syntax_sprint
        run: python manage.py check

      - name: Comprobar migraciones
        working-directory: syntax_sprint
        run: python manage.py makemigrations --check --dry-run

      - name: Ejecutar pruebas
        working-directory: syntax_sprint
        run: python manage.py test

      - name: Pylint
        working-directory: syntax_sprint
        run: pylint backend --rcfile=../.pylintrc

      - name: Métricas de código
        run: python specs/tools/code_metrics.py --strict
