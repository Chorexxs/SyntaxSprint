name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, check y pruebas
    runs-on: ubuntu-latest
    env:
      # Valores exclusivos de CI. No son secretos de producción.
      SECRET_KEY: ci-only-placeholder-key-not-used-in-production-0000000000
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      # Vacío => la suite usa SQLite en memoria, sin servicio PostgreSQL.
      DATABASE_URL: ""
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Comprobar dependencias
        run: python specs/tools/check_dependencies.py --strict

      - name: Comprobar imports (isort)
        working-directory: syntax_sprint
        run: isort --check-only --diff .

      - name: Comprobar el proyecto
        working-directory: syntax_sprint
        run: python manage.py check

      - name: Comprobar migraciones
        working-directory: syntax_sprint
        run: python manage.py makemigrations --check --dry-run

      - name: Ejecutar pruebas
        working-directory: syntax_sprint
        run: python manage.py test

      # Informativo hasta cerrar T008-09 y T008-10 (ver T008-16).
      - name: Pylint (informativo)
        working-directory: syntax_sprint
        run: pylint backend
        continue-on-error: true
