name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, check y pruebas
    # ubuntu-latest (26.04) ya no publica el patch 3.12.1 que exige .python-version.
    runs-on: ubuntu-24.04
    env:
      # Valores exclusivos de CI. No son secretos de producción.
      SECRET_KEY: ci-only-placeholder-key-not-used-in-production-0000000000
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      # Vacío => la suite usa SQLite en memoria, sin servicio PostgreSQL.
      DATABASE_URL: ""
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Instalar Tailwind
        run: npm ci

      - name: Comprobar el CSS compilado
        run: |
          npm run build:css
          git diff --exit-code -- syntax_sprint/static/css/tailwind.css

      - name: Comprobar dependencias
        run: python specs/tools/check_dependencies.py --strict

      - name: Comprobar imports (isort)
        working-directory: syntax_sprint
        run: isort --check-only --diff .

      - name: Comprobar el proyecto
        working-directory: syntax_sprint
        run: python manage.py check

      - name: Comprobar migraciones
        working-directory: syntax_sprint
        run: python manage.py makemigrations --check --dry-run

      - name: Ejecutar pruebas
        working-directory: syntax_sprint
        run: python manage.py test

      - name: Pylint
        working-directory: syntax_sprint
        run: pylint backend --rcfile=../.pylintrc

      - name: Métricas de código
        run: python specs/tools/code_metrics.py --strict
