# Blueprint de Render para SyntaxSprint.
# Uso: Render Dashboard -> New -> Blueprint -> selecciona este repositorio.
# Si el servicio ya existe, revisa que estas variables coincidan con el dashboard.
#
# La base de datos es PostgreSQL gestionada por Render (plan free).
# Si prefieres SQLite con disco persistente (plan de pago), elimina `databases`
# y la variable DATABASE_URL, y añade:
#   disk:
#     name: syntaxsprint-data
#     mountPath: /var/data
#     sizeGB: 1
#   envVars:
#     - key: DB_PATH
#       value: /var/data/db.sqlite3

databases:
  - name: syntaxsprint-db
    plan: free
    databaseName: syntaxsprint
    user: syntaxsprint
    region: oregon

services:
  - type: web
    name: syntaxsprint
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python syntax_sprint/manage.py collectstatic --noinput
    startCommand: python syntax_sprint/manage.py migrate --noinput && gunicorn --chdir syntax_sprint syntax_sprint.wsgi:application
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: syntaxsprint.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://syntaxsprint.onrender.com
      - key: TRUST_PROXY_HEADERS
        value: "True"
      - key: RUN_MIGRATIONS_ON_START
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.1"
      - key: DATABASE_URL
        fromDatabase:
          name: syntaxsprint-db
          property: connectionString
