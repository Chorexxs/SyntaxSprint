# Blueprint de Render para SyntaxSprint.
# Uso: Render Dashboard -> New -> Blueprint -> selecciona este repositorio.
# Si el servicio ya existe, revisa que estas variables coincidan con el dashboard.
#
# La base de datos es PostgreSQL de InsForge. Configura DATABASE_URL con:
#   npx -y @insforge/cli@latest db connection-string
# No la guardes en el repositorio: usa la variable de entorno de Render.

services:
  - type: web
    name: syntaxsprint
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python syntax_sprint/manage.py collectstatic --noinput
    startCommand: python syntax_sprint/manage.py migrate --noinput && python syntax_sprint/manage.py createcachetable && gunicorn --chdir syntax_sprint syntax_sprint.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: syntaxsprint.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://syntaxsprint.onrender.com
      - key: TRUST_PROXY_HEADERS
        value: "True"
      - key: RATE_LIMIT_CACHE_ALIAS
        # Caché de BD compartida entre workers; la tabla la crea createcachetable.
        value: shared
      - key: ADMIN_TOTP_REQUIRED
        # Actívalo solo después de enrolar el TOTP del admin.
        value: "False"
      - key: PYTHON_VERSION
        # Debe coincidir con .python-version; lo valida specs/tools/check_dependencies.py.
        value: "3.12.1"
      - key: DATABASE_URL
        sync: false
