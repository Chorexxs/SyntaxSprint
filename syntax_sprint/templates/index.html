{% load static %}

<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyntaxSprint - Minimalist Typing Test</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'icon/icon.svg' %}">
  
  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'bg-primary': 'var(--bg-primary)',
            'bg-secondary': 'var(--bg-secondary)',
            'text-main': 'var(--text-main)',
            'text-sub': 'var(--text-sub)',
            'text-active': 'var(--text-active)',
            'caret': 'var(--caret)',
            'success': 'var(--success)',
            'error': 'var(--error)',
          },
          fontFamily: {
            'mono': ['JetBrains Mono', 'Fira Code', 'monospace'],
          }
        }
      }
    }
  </script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="bg-[var(--bg-primary)] text-[var(--text-sub)] font-mono min-h-screen flex flex-col transition-colors duration-200">
  
  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 z-50 px-6 py-4 flex justify-between items-center">
    <a href="{% url 'index' %}" class="text-2xl font-semibold tracking-tight">
      <span class="text-[var(--text-active)]">Syntax</span><span class="text-[var(--caret)]">Sprint</span>
    </a>
    
    <nav class="flex items-center gap-4">
      <!-- Theme Toggle -->
      <button id="theme-toggle" class="p-2 rounded-lg hover:bg-[var(--bg-secondary)] transition-colors" title="Toggle theme">
        <svg id="sun-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
        <svg id="moon-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
      </button>
      
      {% if user.is_authenticated %}
        <a href="{% url 'profile' %}" class="text-sm hover:text-[var(--text-active)] transition-colors">{{ user.username }}</a>
        <a href="{% url 'logout' %}" class="text-sm hover:text-[var(--text-active)] transition-colors">logout</a>
      {% else %}
        <a href="{% url 'login' %}" class="text-sm hover:text-[var(--text-active)] transition-colors">login</a>
      {% endif %}
    </nav>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col items-center justify-center px-4 pt-16">
    
    <!-- Hero / Before Test -->
    <div id="hero-section" class="text-center">
      <h1 class="text-4xl md:text-5xl font-semibold text-[var(--text-active)] mb-4">
        How fast can you type?
      </h1>
      <p class="text-lg text-[var(--text-sub)] mb-8">
        Test your typing speed with real code snippets
      </p>
      
      <!-- Language Selector -->
      <div class="mb-6">
        <select id="language-select" class="bg-[var(--bg-secondary)] text-[var(--text-main)] px-4 py-2 rounded-lg border border-[var(--text-sub)]/20 focus:outline-none focus:border-[var(--caret)]">
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="typescript">TypeScript</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="sql">SQL</option>
          <option value="java">Java</option>
          <option value="go">Go</option>
        </select>
      </div>
      
      <button id="start-btn" class="px-8 py-3 bg-[var(--caret)] text-[var(--bg-primary)] font-semibold rounded-lg hover:opacity-90 transition-opacity">
        start
      </button>
    </div>

    <!-- Test Area -->
    <div id="test-area" class="hidden w-full max-w-4xl">
      <!-- Timer & Stats -->
      <div class="flex justify-between items-center mb-6 px-2">
        <div class="text-2xl font-semibold text-[var(--text-active)]" id="timer">30</div>
        <div class="flex gap-6 text-sm">
          <div class="text-[var(--text-sub)]">
            wpm <span id="live-wpm" class="text-[var(--text-active)]">0</span>
          </div>
          <div class="text-[var(--text-sub)]">
            acc <span id="live-acc" class="text-[var(--text-active)]">100%</span>
          </div>
        </div>
      </div>
      
      <!-- Code Display -->
      <div id="prompt-display" class="text-xl md:text-2xl leading-relaxed whitespace-pre-wrap break-words font-mono"></div>
      
      <!-- Hidden Input -->
      <textarea id="words-input" class="opacity-0 absolute pointer-events-none" spellcheck="false" autocomplete="off" value=""></textarea>
    </div>

    <!-- Results -->
    <div id="results-section" class="hidden text-center">
      <div class="grid grid-cols-2 gap-8 mb-8">
        <div>
          <div class="text-6xl font-semibold text-[var(--text-active)]" id="wpm-result">0</div>
          <div class="text-sm text-[var(--text-sub)] mt-2">wpm</div>
        </div>
        <div>
          <div class="text-6xl font-semibold text-[var(--text-active)]" id="acc-result">100%</div>
          <div class="text-sm text-[var(--text-sub)] mt-2">accuracy</div>
        </div>
      </div>
      
      <button id="restart-btn" class="px-6 py-2 border border-[var(--text-sub)]/30 rounded-lg hover:bg-[var(--bg-secondary)] transition-colors">
        try again
      </button>
    </div>

  </main>

  <!-- Footer -->
  <footer class="py-6 text-center text-sm text-[var(--text-sub)]/60">
    <a href="https://github.com/Chorexxs" target="_blank" class="hover:text-[var(--text-sub)] transition-colors">GitHub</a>
    <span class="mx-2">·</span>
    <a href="https://www.linkedin.com/in/oswaldo-fonseca-gonzalez/" target="_blank" class="hover:text-[var(--text-sub)] transition-colors">LinkedIn</a>
  </footer>

  <script>
    const apiUrl = "{% url 'get_python_function' %}";
    const saveResultUrl = "{% url 'save_typing_test_result' %}";
  </script>
  <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
